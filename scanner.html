
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c69">
  <title>SCNHS QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
    header{background:#123c69;color:white;text-align:center;padding:22px 14px}
    main{max-width:680px;margin:22px auto;padding:0 14px}
    .card{background:white;padding:20px;border-radius:13px;margin-bottom:16px}
    h2{color:#123c69}
    .button{border:0;border-radius:8px;padding:12px 16px;background:#123c69;color:white;font-size:15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin:5px}
    .gray{background:#64748b}
    .green{background:#15803d}
    input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
    #reader{width:100%;max-width:480px;margin:12px auto}
    .message{padding:12px;border-radius:8px;background:#eff6ff;color:#1e40af;margin:12px 0}
    .error{background:#fee2e2;color:#991b1b}
    .success{background:#dcfce7;color:#166534}
    .muted{font-size:13px;color:#64748b;line-height:1.5}
    #openLink{display:none}
  </style>
</head>
<body>
<header><h1>SCNHS QR Scanner</h1></header>
<main>
  <section class="card">
    <h2>Scan student QR code</h2>
    <p class="muted">Allow camera access and position the QR code inside the scanning frame.</p>
    <div id="reader"></div>
    <button class="button" onclick="startScanner()">Start Camera</button>
    <button class="button gray" onclick="stopScanner()">Stop Camera</button>
    <div id="message" class="message">Scanner is ready.</div>
    <a id="openLink" class="button green" href="#" target="_blank" rel="noopener">Open Student Attendance Page</a>
  </section>

  <section class="card">
    <h2>Enter a QR link manually</h2>
    <input id="manualUrl" type="url" placeholder="Paste student QR link">
    <button class="button" onclick="useManualLink()">Check Link</button>
  </section>
</main>

<script>
let scanner = null;
let isScanning = false;

function showMessage(text,type){
  const box=document.getElementById("message");
  box.className="message"+(type?" "+type:"");
  box.textContent=text;
}

function validateStudentUrl(raw){
  let url;
  try{
    url=new URL(String(raw||"").trim());
  }catch(e){
    throw new Error("Invalid QR link.");
  }

  const allowedHosts=[
    "script.google.com",
    "script.googleusercontent.com"
  ];

  if(url.protocol!=="https:" || !allowedHosts.includes(url.hostname)){
    throw new Error("Not an approved SCNHS link.");
  }

  const token=url.searchParams.get("token");

  if(!token || !/^[a-f0-9]{64}$/i.test(token)){
    throw new Error("Invalid student QR token.");
  }

  return url.href;
}

function showOpenButton(url){
  const link=document.getElementById("openLink");
  link.href=url;
  link.style.display="inline-block";
  showMessage("Valid student QR detected! Tap the green button.","success");
}

async function startScanner(){
  if(typeof Html5Qrcode==="undefined"){
    showMessage("Scanner library failed to load.","error");
    return;
  }

  if(isScanning)return;

  try{
    document.getElementById("openLink").style.display="none";

    if(!scanner)scanner=new Html5Qrcode("reader");

    const cameras=await Html5Qrcode.getCameras();

    if(!cameras.length)throw new Error("No camera found.");

    const camera=cameras.find(c=>/back|rear|environment/i.test(c.label))||cameras[0];

    await scanner.start(
      camera.id,
      {fps:10,qrbox:{width:240,height:240},aspectRatio:1},
      decodedText=>{
        try{
          const validUrl=validateStudentUrl(decodedText);
          stopScanner();
          showOpenButton(validUrl);
        }catch(error){
          showMessage(error.message,"error");
        }
      },
      ()=>{}
    );

    isScanning=true;
    showMessage("Camera is on. Scan a student QR code.");
  }catch(error){
    showMessage(error.message||String(error),"error");
  }
}

async function stopScanner(){
  if(scanner && isScanning){
    try{await scanner.stop();}catch(e){}
    isScanning=false;
  }
}

function useManualLink(){
  try{
    const url=validateStudentUrl(document.getElementById("manualUrl").value);
    showOpenButton(url);
  }catch(error){
    document.getElementById("openLink").style.display="none";
    showMessage(error.message,"error");
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden)stopScanner();
});
</script>
</body>
</html>
